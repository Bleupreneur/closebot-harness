name: closebot
version: 1.0.0
description: "CloseBot.ai CLI \u2014 agent-native, mirrors the REST + Live Message API."
auth:
  env: CLOSEBOT_API_KEY
  header: X-CB-KEY
base_urls:
  rest: https://api.closebot.com
  message: https://api.closebot.ai
global_flags:
- name: --json
  doc: 'Output raw JSON (default: pretty)'
- name: --dry-run
  doc: Print the request without sending
- name: --confirm
  doc: Required to run a Tier 2 operation (DELETE, publish, billing refills)
- name: --unsafe-raw
  doc: Skip redaction/projection; prints raw token fields and raw source rows
commands:
  account:
    post-apikey:
      method: POST
      path: /account/apiKey
      summary: Create API Key
      args: []
      request_body: CreateApiKeyInput
      response: CreateApiKeyOutput
      example: closebot account post-apikey
    get-apikey:
      method: GET
      path: /account/apiKey
      summary: List API keys
      args: []
      request_body: null
      response: ApiKeyDTO
      example: closebot account get-apikey
    delete-apikey:
      method: DELETE
      path: /account/apiKey/{keyId}
      summary: Delete API Key
      args:
      - name: keyId
        in: path
        required: true
        type: string
        doc: The key ID.
      request_body: null
      response: null
      example: closebot account delete-apikey
  accountnotification:
    get-account-notifications:
      method: GET
      path: /account-notifications
      summary: List the calling account's notifications for the active agency.
      args: []
      request_body: null
      response: AccountNotificationDto
      example: closebot accountnotification get-account-notifications
    put-account-notifications:
      method: PUT
      path: /account-notifications/{id}
      summary: Update one of the calling account's notifications.
      args:
      - name: id
        in: path
        required: true
        type: string
        doc: null
      request_body: AccountNotificationUpdateDto
      response: AccountNotificationDto
      example: closebot accountnotification put-account-notifications --id <uuid>
  agency:
    get-current:
      method: GET
      path: /agency/current
      summary: Get agency
      args: []
      request_body: null
      response: AgencyDto
      example: closebot agency get-current
    get-usage:
      method: GET
      path: /agency/usage
      summary: Get usage
      args:
      - name: scopes
        in: query
        required: false
        type: string
        doc: 'Comma-separated list of scopes to retrieve. Scopes are: bots, storage, users, responses.'
      request_body: null
      response: null
      example: closebot agency get-usage
    post-invite:
      method: POST
      path: /agency/invite
      summary: Invite users
      args: []
      request_body: InviteUserInput
      response: null
      example: closebot agency post-invite
    delete-invite:
      method: DELETE
      path: /agency/invite
      summary: Revoke invitation
      args:
      - name: email
        in: query
        required: false
        type: string
        doc: The invited email to revoke
      request_body: null
      response: null
      example: closebot agency delete-invite
    get-agency:
      method: GET
      path: /agency
      summary: List agencies
      args: []
      request_body: null
      response: AgencyDto
      example: closebot agency get-agency
  analytics:
    get-values:
      method: GET
      path: /analytics/dimensions/{dimension}/values
      summary: List dimension values available for a given dimension.
      args:
      - name: dimension
        in: path
        required: true
        type: string
        doc: One of channel, bot, persona, detail1, detail2.
      - name: metric
        in: query
        required: false
        type: string
        doc: "Required for detail1/detail2 \u2014 their meaning depends on the metric."
      request_body: null
      response: AnalyticsDimensionValueDto
      example: closebot analytics get-values
    get-metrics:
      method: GET
      path: /analytics/metrics
      summary: List all metrics available.
      args: []
      request_body: null
      response: AnalyticsMetricDto
      example: closebot analytics get-metrics
    post-query:
      method: POST
      path: /analytics/query
      summary: Run an analytics query for the active agency.
      args: []
      request_body: AnalyticsQueryRequest
      response: AnalyticsQueryResponse
      example: closebot analytics post-query
    get-source-timezones:
      method: GET
      path: /analytics/source-timezones
      summary: 'Time zones configured on the agency''s sources, used to pick a sensible default for

        time-of-day analytics (see the hourOfWeek resolution on POST /analytics/query).'
      args:
      - name: sourceIds
        in: query
        required: false
        type: array
        doc: null
      request_body: null
      response: AnalyticsSourceTimeZonesResponse
      example: closebot analytics get-source-timezones
    post-options:
      method: POST
      path: /analytics/topics/options
      summary: Topics available as a conversations filter, optionally scoped to a set of sources.
      args: []
      request_body: TopicOptionsRequest
      response: TopicOptionsResponse
      example: closebot analytics post-options
    post-topics:
      method: POST
      path: /analytics/topics
      summary: Topic treemap and per-topic daily series for the active agency.
      args: []
      request_body: TopicsQueryRequest
      response: TopicsQueryResponse
      example: closebot analytics post-topics
  billing:
    post-refill:
      method: POST
      path: /agency/billing/refill
      summary: Refill agency wallet
      args: []
      request_body: CreateRefillDto
      response: null
      example: closebot billing post-refill
    post-source:
      method: POST
      path: /agency/billing/refill/source/{sourceId}
      summary: Refill source wallet
      args:
      - name: sourceId
        in: path
        required: true
        type: string
        doc: The source ID.
      request_body: CreateRefillDto
      response: null
      example: closebot billing post-source
    get-re-billing:
      method: GET
      path: /agency/billing/re-billing
      summary: Get re-billing settings
      args: []
      request_body: null
      response: ReBillingDto
      example: closebot billing get-re-billing
    put-re-billing:
      method: PUT
      path: /agency/billing/re-billing
      summary: Update re-billing
      args: []
      request_body: ReBillingUpdateInput
      response: null
      example: closebot billing put-re-billing
    get-ai-cost-breakdown:
      method: GET
      path: /agency/billing/ai-cost-breakdown
      summary: AI cost breakdown for a period
      args:
      - name: startTime
        in: query
        required: false
        type: string
        doc: null
      - name: endTime
        in: query
        required: false
        type: string
        doc: null
      - name: sourceId
        in: query
        required: false
        type: string
        doc: null
      request_body: null
      response: AiCostBreakdownDto
      example: closebot billing get-ai-cost-breakdown
    get-balance:
      method: GET
      path: /agency/billing/balance
      summary: Get agency balance
      args: []
      request_body: null
      response: BalanceDto
      example: closebot billing get-balance
    get-options:
      method: GET
      path: /agency/billing/options
      summary: Get agency billing
      args: []
      request_body: null
      response: BillingOptionsDto
      example: closebot billing get-options
    put-options:
      method: PUT
      path: /agency/billing/options
      summary: Update agency billing
      args: []
      request_body: UpdateBillingConfigInput
      response: BillingOptionsDto
      example: closebot billing put-options
    get-source:
      method: GET
      path: /agency/billing/balance/source/{sourceId}
      summary: Get source balance
      args:
      - name: sourceId
        in: path
        required: true
        type: string
        doc: The source ID.
      request_body: null
      response: BalanceDto
      example: closebot billing get-source
    get-source-2:
      method: GET
      path: /agency/billing/transactions/source/{sourceId}
      summary: List source transactions
      args:
      - name: sourceId
        in: path
        required: true
        type: string
        doc: The source ID.
      - name: status
        in: query
        required: false
        type: string
        doc: 'Filter by status when included. Statuses are: pending, succeeded, failed.'
      - name: type
        in: query
        required: false
        type: string
        doc: 'Filter by transaction type when included. Comma-separated list of:'
      - name: page
        in: query
        required: false
        type: integer
        doc: null
      - name: pageSize
        in: query
        required: false
        type: integer
        doc: null
      request_body: null
      response: TransactionDtoPaginated
      example: closebot billing get-source-2
    post-source-2:
      method: POST
      path: /agency/billing/transactions/source/{sourceId}
      summary: Add source transaction
      args:
      - name: sourceId
        in: path
        required: true
        type: string
        doc: The source ID.
      request_body: AddSourceTransactionDto
      response: TransactionDto
      example: closebot billing post-source-2
    get-transactions:
      method: GET
      path: /agency/billing/transactions
      summary: List agency transactions
      args:
      - name: status
        in: query
        required: false
        type: string
        doc: 'Filter by status when included. Statuses are: pending, succeeded, failed.'
      - name: type
        in: query
        required: false
        type: string
        doc: 'Filter by transaction type when included. Comma-separated list of:'
      - name: page
        in: query
        required: false
        type: integer
        doc: null
      - name: pageSize
        in: query
        required: false
        type: integer
        doc: null
      request_body: null
      response: TransactionDtoPaginated
      example: closebot billing get-transactions
    get-usages:
      method: GET
      path: /agency/billing/usages
      summary: List billed usages
      args:
      - name: startTime
        in: query
        required: false
        type: string
        doc: The start time.
      - name: endTime
        in: query
        required: false
        type: string
        doc: The end time.
      request_body: null
      response: BilledUsageDto
      example: closebot billing get-usages
    delete-source:
      method: DELETE
      path: /agency/billing/transactions/source/{sourceId}/{id}
      summary: Delete source transaction
      args:
      - name: sourceId
        in: path
        required: true
        type: string
        doc: The source ID.
      - name: id
        in: path
        required: true
        type: integer
        doc: ID of the transaction to delete.
      request_body: null
      response: null
      example: closebot billing delete-source --id <uuid>
  bot:
    post-ai:
      method: POST
      path: /bot/ai
      summary: Create bot with AI
      args: []
