      args:
      - name: id
        in: path
        required: true
        type: string
        doc: null
      - name: sourceId
        in: path
        required: true
        type: string
        doc: null
      - name: serverUrl
        in: query
        required: false
        type: string
        doc: null
      request_body: null
      response: null
      example: closebot bot delete-mcp-server --id <uuid>
    post-bot:
      method: POST
      path: /bot
      summary: Create a new bot
      args: []
      request_body: CreateBotInput
      response: BotDto
      example: closebot bot post-bot
    get-bot:
      method: GET
      path: /bot
      summary: List bots
      args: []
      request_body: null
      response: BotDto
      example: closebot bot get-bot
    delete-bot:
      method: DELETE
      path: /bot/{id}
      summary: Delete a bot
      args:
      - name: id
        in: path
        required: true
        type: string
        doc: The bot ID.
      request_body: null
      response: null
      example: closebot bot delete-bot --id <uuid>
    get-bot-2:
      method: GET
      path: /bot/{id}
      summary: Get a bot
      args:
      - name: id
        in: path
        required: true
        type: string
        doc: The bot ID.
      request_body: null
      response: BotDto
      example: closebot bot get-bot-2 --id <uuid>
    put-bot:
      method: PUT
      path: /bot/{id}
      summary: Update a bot
      args:
      - name: id
        in: path
        required: true
        type: string
        doc: The bot ID.
      request_body: UpdateBotInput
      response: BotDto
      example: closebot bot put-bot --id <uuid>
    post-duplicate:
      method: POST
      path: /bot/{id}/duplicate
      summary: Duplicate a bot
      args:
      - name: id
        in: path
        required: true
        type: string
        doc: The bot ID.
      request_body: null
      response: BotDto
      example: closebot bot post-duplicate --id <uuid>
    post-end:
      method: POST
      path: /bot/{id}/persona-split-test/end
      summary: End a persona split test
      args:
      - name: id
        in: path
        required: true
        type: string
        doc: The bot ID.
      request_body: null
      response: BotDto
      example: closebot bot post-end --id <uuid>
    get-export:
      method: GET
      path: /bot/{id}/export
      summary: Export a bot
      args:
      - name: id
        in: path
        required: true
        type: string
        doc: The bot ID.
      - name: botVersion
        in: query
        required: false
        type: string
        doc: The bot version (x.y.z). If not provided, the latest version is exported.
      request_body: null
      response: ExportBotResponse
      example: closebot bot get-export --id <uuid>
    get-templates:
      method: GET
      path: /bot/bbb/templates
      summary: Get bot builder builder templates
      args: []
      request_body: null
      response: null
      example: closebot bot get-templates
    get-steps:
      method: GET
      path: /bot/{id}/steps
      summary: Get steps for a version
      args:
      - name: id
        in: path
        required: true
        type: string
        doc: The bot ID.
      - name: botVersion
        in: query
        required: false
        type: string
        doc: The bot version (x.y.z).
      request_body: null
      response: null
      example: closebot bot get-steps --id <uuid>
    get-persona-performance:
      method: GET
      path: /bot/{id}/persona-performance
      summary: Persona performance for a bot, scoped to a date range or split-test window.
      args:
      - name: id
        in: path
        required: true
        type: string
        doc: The bot ID.
      - name: start
        in: query
        required: false
        type: string
        doc: Inclusive start of the performance window.
      - name: end
        in: query
        required: false
        type: string
        doc: Exclusive end of the performance window.
      - name: splitTestId
        in: query
        required: false
        type: string
        doc: Optional split-test ID (the bot ID of the 1:1 split test). Uses that
      request_body: null
      response: BotPersonaPerformanceResponseDto
      example: closebot bot get-persona-performance --id <uuid>
    get-persona-split-tests:
      method: GET
      path: /bot/{id}/persona-split-tests
      summary: List past persona split tests for a bot
      args:
      - name: id
        in: path
        required: true
        type: string
        doc: The bot ID.
      - name: skip
        in: query
        required: false
        type: integer
        doc: Records to skip. Defaults to 0.
      - name: take
        in: query
        required: false
        type: integer
        doc: Page size, clamped to Closebot.Api.Controllers.BotController.MaxSplitTestPageSize.
      request_body: null
      response: PersonaSplitTestPageDto
      example: closebot bot get-persona-split-tests --id <uuid>
